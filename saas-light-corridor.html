<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Light Corridor Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Deltha';
            src: url('./fonts/Deltha.otf') format('opentype'),
                url('./fonts/Deltha.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #040407;
            --text-main: #ffffff;
            --text-muted: #8f9db5;
            --corridor-light: rgba(200, 220, 255, 0.8);
            --corridor-glow: rgba(140, 170, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        nav {
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            position: relative;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.15em;
            color: var(--text-main);
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        /* CORRIDOR BACKGROUND */
        .corridor-container {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            perspective: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The corridor itself – a series of nested rectangles getting smaller toward center */
        .corridor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .corridor-frame {
            position: absolute;
            border: 1px solid rgba(200, 220, 255, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* 8 frames creating perspective tunnel effect */
        .cf-1 {
            width: 200vw;
            height: 200vh;
            border-color: rgba(200, 220, 255, 0.02);
        }

        .cf-2 {
            width: 160vw;
            height: 160vh;
            border-color: rgba(200, 220, 255, 0.03);
        }

        .cf-3 {
            width: 120vw;
            height: 120vh;
            border-color: rgba(200, 220, 255, 0.05);
        }

        .cf-4 {
            width: 100vw;
            height: 100vh;
            border-color: rgba(200, 220, 255, 0.07);
        }

        .cf-5 {
            width: 70vw;
            height: 70vh;
            border-color: rgba(200, 220, 255, 0.1);
        }

        .cf-6 {
            width: 45vw;
            height: 45vh;
            border-color: rgba(200, 220, 255, 0.15);
        }

        .cf-7 {
            width: 25vw;
            height: 25vh;
            border-color: rgba(200, 220, 255, 0.2);
        }

        .cf-8 {
            width: 10vw;
            height: 10vh;
            border-color: rgba(200, 220, 255, 0.4);
            box-shadow: 0 0 30px rgba(140, 170, 255, 0.3);
        }

        /* Edge lights running along sides of the corridor — like sconce lights */
        .edge-lights {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Left edge light strip */
        .edge-lights::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom,
                    transparent 0%,
                    rgba(140, 170, 255, 0.4) 20%,
                    rgba(255, 255, 255, 0.8) 50%,
                    rgba(140, 170, 255, 0.4) 80%,
                    transparent 100%);
            box-shadow: 0 0 20px rgba(140, 170, 255, 0.3), 0 0 60px rgba(140, 170, 255, 0.1);
            filter: blur(1px);
        }

        /* Right edge light strip */
        .edge-lights::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom,
                    transparent 0%,
                    rgba(140, 170, 255, 0.4) 20%,
                    rgba(255, 255, 255, 0.8) 50%,
                    rgba(140, 170, 255, 0.4) 80%,
                    transparent 100%);
            box-shadow: 0 0 20px rgba(140, 170, 255, 0.3), 0 0 60px rgba(140, 170, 255, 0.1);
            filter: blur(1px);
        }

        /* Vanishing point glow at center */
        .vanishing-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at center,
                    rgba(220, 235, 255, 0.3) 0%,
                    rgba(140, 170, 255, 0.1) 40%,
                    transparent 70%);
            filter: blur(20px);
            z-index: 3;
            mix-blend-mode: screen;
        }

        /* Hero Content */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 20px;
        }

        .content-layer {
            max-width: 800px;
        }

        .headline {
            font-family: 'Deltha', 'Clash Display', sans-serif;
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: normal;
            line-height: 0.85;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(140, 170, 255, 0.4), 0 10px 30px rgba(0, 0, 0, 0.6);
            animation: emergeFromDepth 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.7);
        }

        .description {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 580px;
            margin: 0 auto 3rem;
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .cta-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 3rem;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-radius: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(200, 220, 255, 0.5);
            box-shadow: 0 0 20px rgba(140, 170, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(200, 220, 255, 0.9);
            box-shadow: 0 0 30px rgba(140, 170, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        @keyframes emergeFromDepth {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .cta-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .cf-1,
            .cf-2,
            .cf-3 {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Corridor Tunnel Perspective Background -->
    <div class="corridor-container">
        <div class="corridor">
            <div class="corridor-frame cf-1"></div>
            <div class="corridor-frame cf-2"></div>
            <div class="corridor-frame cf-3"></div>
            <div class="corridor-frame cf-4"></div>
            <div class="corridor-frame cf-5"></div>
            <div class="corridor-frame cf-6"></div>
            <div class="corridor-frame cf-7"></div>
            <div class="corridor-frame cf-8"></div>
        </div>
        <div class="vanishing-glow"></div>
    </div>

    <!-- Edge Strip Lights -->
    <div class="edge-lights"></div>

    <nav>
        <a href="#" class="logo">PRISM</a>
        <div class="nav-links">
            <a href="#">Solutions</a>
            <a href="#">Tunnel</a>
            <a href="#">Reach Us</a>
        </div>
    </nav>

    <main class="hero">
        <div class="content-layer">
            <h1 class="headline">Forward</h1>
            <p class="description">An unbroken path toward clarity. Engineered to guide you through the most complex
                operational landscapes.</p>
            <div class="cta-group">
                <a href="#" class="btn btn-primary">Walk Through</a>
                <a href="#" class="btn btn-secondary">See Architecture</a>
            </div>
        </div>
    </main>

</body>

</html>
