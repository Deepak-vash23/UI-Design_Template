<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Shadow Geometry Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Deltha';
            src: url('./fonts/Deltha.otf') format('opentype'),
                url('./fonts/Deltha.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #070709;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        nav {
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            position: relative;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.15em;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        /* LARGE GEOMETRIC SHADOW SHAPES */
        .geo-container {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .geo {
            position: absolute;
            background: #0e0e12;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Large triangle (clip-path) upper left */
        .geo-tri-1 {
            width: 60vw;
            height: 60vw;
            top: -20vw;
            left: -15vw;
            clip-path: polygon(0 0, 100% 0, 0% 100%);
            background: linear-gradient(135deg, #111115, #070709);
            transform: rotate(-10deg);
            box-shadow: 20px 20px 80px rgba(0, 0, 0, 0.8);
            animation: geoFloat1 18s ease-in-out infinite alternate;
        }

        /* Large rectangle lower right */
        .geo-rect-1 {
            width: 55vw;
            height: 55vw;
            bottom: -20vw;
            right: -10vw;
            transform: rotate(30deg);
            background: linear-gradient(225deg, #0f0f14, #070709);
            box-shadow: -20px -20px 80px rgba(0, 0, 0, 0.8);
            animation: geoFloat2 22s ease-in-out infinite alternate;
        }

        /* Narrow diagonal bar top right */
        .geo-bar-1 {
            width: 4px;
            height: 70vh;
            top: 10vh;
            right: 25vw;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.15) 50%, transparent);
            transform: rotate(25deg);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            filter: blur(1px);
        }

        /* Smaller accent diamond */
        .geo-diamond {
            width: 200px;
            height: 200px;
            top: 15vh;
            right: 8vw;
            background: #0c0c10;
            transform: rotate(45deg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 10px 10px 40px rgba(0, 0, 0, 0.6);
            animation: geoFloat1 14s ease-in-out infinite alternate;
        }

        /* Subtle directional light from upper-right */
        .light-source {
            position: absolute;
            top: -30vh;
            right: -10vw;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle at center,
                    rgba(255, 255, 240, 0.06) 0%,
                    transparent 60%);
            z-index: 3;
            pointer-events: none;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 20px;
        }

        .content-layer {
            max-width: 800px;
        }

        .headline {
            font-family: 'Deltha', 'Clash Display', sans-serif;
            font-size: clamp(4rem, 9vw, 8rem);
            font-weight: normal;
            line-height: 0.85;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(25px);
            animation: up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .description {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            color: #888;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .cta-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem 3.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-radius: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .btn-primary:hover {
            background: transparent;
            color: #fff;
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #fff;
        }

        @keyframes up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes geoFloat1 {
            0% {
                transform: rotate(-10deg) translateY(0);
            }

            100% {
                transform: rotate(-10deg) translateY(-25px);
            }
        }

        @keyframes geoFloat2 {
            0% {
                transform: rotate(30deg) translateY(0);
            }

            100% {
                transform: rotate(30deg) translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .cta-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Geometric Shadows Background -->
    <div class="geo-container">
        <div class="geo geo-tri-1"></div>
        <div class="geo geo-rect-1"></div>
        <div class="geo geo-diamond"></div>
        <div class="geo-bar-1"></div>
        <div class="light-source"></div>
    </div>

    <nav>
        <a href="#" class="logo">FORM</a>
        <div class="nav-links">
            <a href="#">Structure</a>
            <a href="#">Composition</a>
            <a href="#">Build</a>
        </div>
    </nav>

    <main class="hero">
        <div class="content-layer">
            <h1 class="headline">Contrast</h1>
            <p class="description">Where shadows define form and structure demands attention. Bold geometric discipline
                meets cutting-edge performance.</p>
            <div class="cta-group">
                <a href="#" class="btn btn-primary">Get Started</a>
                <a href="#" class="btn btn-secondary">Explore</a>
            </div>
        </div>
    </main>
</body>

</html>
