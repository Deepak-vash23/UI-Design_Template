<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Digital Grid Floor Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Deltha';
            src: url('./fonts/Deltha.otf') format('opentype'),
                url('./fonts/Deltha.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030108;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        nav {
            width: 100%;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            position: relative;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.15em;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: #9c92b3;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        /* GRID FLOOR SCENE */
        .grid-scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            z-index: 1;
            pointer-events: none;
            perspective: 600px;
            perspective-origin: 50% 0%;
        }

        .grid-plane {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(143, 96, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(143, 96, 255, 0.2) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(75deg);
            transform-origin: bottom center;
            animation: scrollGrid 8s linear infinite;
        }

        /* Fade the grid out at the edges and top */
        .grid-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(to top, transparent 0%, #030108 80%),
                linear-gradient(to right, #030108 0%, transparent 20%, transparent 80%, #030108 100%);
            z-index: 2;
        }

        /* Horizon glow on the grid */
        .grid-horizon {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(143, 96, 255, 0.6) 30%, rgba(255, 255, 255, 0.5) 50%, rgba(143, 96, 255, 0.6) 70%, transparent);
            box-shadow: 0 0 20px rgba(143, 96, 255, 0.5), 0 0 60px rgba(143, 96, 255, 0.2);
            z-index: 3;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 20px 10vh;
        }

        .content-layer {
            max-width: 800px;
        }

        .headline {
            font-family: 'Deltha', 'Clash Display', sans-serif;
            font-size: clamp(3.5rem, 9vw, 7.5rem);
            font-weight: normal;
            line-height: 0.85;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(143, 96, 255, 0.5);
            opacity: 0;
            transform: translateY(30px);
            animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .description {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            color: #9c92b3;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .cta-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            animation: up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 2.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-radius: 4px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: rgba(143, 96, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(143, 96, 255, 0.7);
            box-shadow: 0 0 20px rgba(143, 96, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .btn-primary:hover {
            background: rgba(143, 96, 255, 0.3);
            box-shadow: 0 0 35px rgba(143, 96, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        @keyframes up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scrollGrid {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 60px;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .cta-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Grid Floor Scene -->
    <div class="grid-scene">
        <div class="grid-plane"></div>
        <div class="grid-fade"></div>
        <div class="grid-horizon"></div>
    </div>

    <nav>
        <a href="#" class="logo">MATRIX</a>
        <div class="nav-links">
            <a href="#">Grid</a>
            <a href="#">Nodes</a>
            <a href="#">Access</a>
        </div>
    </nav>

    <main class="hero">
        <div class="content-layer">
            <h1 class="headline">Grid World</h1>
            <p class="description">Step onto the digital plane. A high-tech environment built on structured, traceable
                infrastructure that scales infinitely.</p>
            <div class="cta-group">
                <a href="#" class="btn btn-primary">Access Grid</a>
                <a href="#" class="btn btn-secondary">View Map</a>
            </div>
        </div>
    </main>
</body>

</html>
